<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Vertex Compass — MVP v0.1</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E40AF'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-opacity='.6'/%3E%3Cpath d='M20 12l-3 6-6 2 3-6z' fill='white'/%3E%3C/svg%3E">
<meta name="description" content="Vertex Compass MVP v0.1 — US college finder, essay fit and 4-year roadmap prototype (internal review).">
<style>
  :root{
    --primary:#1E40AF; --primary-dark:#1B3699; --primary-light:#3B82F6;
    --indigo:#4F46E5; --teal:#0D9488; --amber:#F59E0B; --rose:#E11D48;
    --ink:#0F172A; --ink2:#334155; --muted:#64748B; --muted2:#94A3B8;
    --line:#E2E8F0; --line2:#EEF2F7; --bg:#F4F6FB; --card:#FFFFFF;
    --soft:#F8FAFC; --radius:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.05);
    --shadow-md:0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(900px 520px at 85% -10%, #E0E7FF 0%, rgba(224,231,255,0) 60%),
      radial-gradient(700px 460px at 0% 0%, #CCFBF1 0%, rgba(204,251,241,0) 55%),
      linear-gradient(180deg,#F7F9FD 0%, #EEF2F8 100%);
    color:var(--ink);
    font-family:"Liberation Sans","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .page{min-height:100%;display:flex;align-items:center;justify-content:center}
  .shell{
    width:100%;max-width:420px;height:100vh;height:100dvh;background:#fff;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  @media (min-width:640px){
    .page{padding:26px}
    .shell{height:min(880px, calc(100dvh - 52px));border-radius:30px;
      box-shadow:0 30px 70px rgba(15,23,42,.18), 0 4px 12px rgba(15,23,42,.06), 0 0 0 1px rgba(15,23,42,.05);}
  }
  @media (prefers-reduced-motion:no-preference){
    .shell{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }

  /* ---------- header ---------- */
  .app-head{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:13px 16px 12px;border-bottom:1px solid var(--line2);
    background:linear-gradient(180deg,#FFFFFF 0%,#FCFDFF 100%);z-index:5;
  }
  .mark{width:34px;height:34px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--primary) 0%,var(--indigo) 58%,var(--teal) 100%);
    display:grid;place-items:center;box-shadow:0 3px 8px rgba(30,64,175,.28)}
  .mark svg{width:21px;height:21px;display:block}
  .brand-txt{display:flex;flex-direction:column;line-height:1.18;min-width:0}
  .brand-txt strong{font-size:16px;letter-spacing:-.2px}
  .brand-txt span{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:650}
  .lang{margin-left:auto;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
  .lang button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:750;
    padding:5px 8px;border-radius:8px;cursor:pointer;letter-spacing:.02em;
  }
  .lang button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
  .lang button:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}

  /* ---------- main ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 15px 26px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .tab{display:none}
  .tab.on{display:block}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:2px 0 7px}
  h1{font-size:21px;line-height:1.3;letter-spacing:-.4px;margin:0 0 6px}
  h2{font-size:15px;letter-spacing:-.2px;margin:0 0 4px}
  .sub{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .pad{padding:14px}

  /* ---------- inputs ---------- */
  .filter-card{padding:14px;margin-bottom:14px;background:linear-gradient(180deg,#FFFFFF,#FBFDFF)}
  .field{margin-bottom:13px}
  .field:last-child{margin-bottom:0}
  .field-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
  .field-head label{font-size:11.5px;font-weight:750;color:var(--ink2);letter-spacing:.01em}
  .field-head .val{font-size:14px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
  .field-head .val small{font-size:10.5px;color:var(--muted);font-weight:650;margin-left:3px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;display:block;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#DBEAFE,#E0E7FF)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;
    border:2.5px solid var(--primary);box-shadow:0 2px 6px rgba(30,64,175,.28)
  }
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#E0E7FF}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--primary);box-shadow:0 2px 6px rgba(30,64,175,.28)}
  input[type=range]:focus-visible{outline:2px solid var(--primary-light);outline-offset:4px;border-radius:99px}
  .range-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:1px;font-variant-numeric:tabular-nums}
  select{
    width:100%;font:inherit;font-size:12.5px;font-weight:650;color:var(--ink2);
    padding:9px 30px 9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%2364748B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  select:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}

  .chips{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
  .chip{
    font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:99px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px
  }
  .chip .n{font-size:10px;font-weight:800;color:var(--muted2);background:var(--soft);border-radius:99px;padding:0 5px;line-height:15px}
  .chip.on{background:#EEF2FF;border-color:#C7D2FE;color:var(--primary)}
  .chip.on .n{background:#fff;color:var(--primary)}
  .chip:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 8px}
  .list-head span{font-size:11px;font-weight:700;color:var(--muted)}
  .list-head a{font-size:11px;font-weight:750;color:var(--primary);text-decoration:none}

  /* ---------- school cards ---------- */
  .school{
    width:100%;text-align:left;font:inherit;color:inherit;background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:12px 13px 11px;margin-bottom:9px;
    box-shadow:var(--shadow-sm);cursor:pointer;display:block;transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .school:hover{border-color:#C7D2FE;box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .school:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}
  .s-top{display:flex;align-items:flex-start;gap:8px}
  .s-name{font-size:14.5px;font-weight:800;letter-spacing:-.2px;line-height:1.25;flex:1;min-width:0}
  .s-loc{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px;line-height:1.35}
  .badge{font-size:9.5px;font-weight:850;letter-spacing:.05em;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap;margin-top:1px}
  .badge.reach{background:#FEE2E2;color:#B91C1C}
  .badge.target{background:#FEF3C7;color:#B45309}
  .badge.safety{background:#DCFCE7;color:#15803D}
  .s-stats{display:flex;gap:12px;margin:9px 0 2px;font-size:11px;color:var(--muted);flex-wrap:wrap}
  .s-stats b{color:var(--ink2);font-weight:800;font-variant-numeric:tabular-nums}
  .sat{display:block;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line2)}
  .sat-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted)}
  .sat-top b{color:var(--ink2);font-variant-numeric:tabular-nums}
  .bar{display:block;position:relative;height:7px;border-radius:99px;background:#EEF2F7;margin:6px 0 5px}
  .bar .band{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#BFDBFE,#C7D2FE);border-radius:99px}
  .bar .dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--primary);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(30,64,175,.35)}
  .sat-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:8px}
  .sat-foot span{display:inline}
  .sat-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
  .sat-foot .ok{color:#15803D;font-weight:750}
  .sat-foot .off{color:#B45309;font-weight:750}
  .tf{display:block;margin-top:9px;padding:7px 9px;background:var(--soft);border-radius:8px;font-size:10.5px;color:var(--muted);font-weight:650}
  .s-fit{display:flex;align-items:baseline;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line2)}
  .s-fit span{font-size:10.5px;font-weight:700;color:var(--muted)}
  .s-fit b{font-size:14px;font-weight:850;color:var(--primary);font-variant-numeric:tabular-nums}
  .s-fit i{font-size:9.5px;color:var(--muted2);font-style:normal;margin-left:auto;text-align:right;line-height:1.3}
  .empty{padding:26px 16px;text-align:center;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--soft)}

  /* ---------- tab2 ---------- */
  .back{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;color:var(--primary);background:none;border:0;padding:2px 0;margin-bottom:10px;cursor:pointer;font-family:inherit}
  .detail-head{padding:14px;margin-bottom:11px;background:linear-gradient(160deg,#F8FAFF 0%,#FFFFFF 60%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .dh-top{display:flex;gap:10px;align-items:flex-start}
  .crest{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;font-weight:850;color:#fff;letter-spacing:-.5px;background:linear-gradient(140deg,var(--primary),var(--indigo) 60%,var(--teal));box-shadow:0 3px 8px rgba(30,64,175,.22)}
  .dh-name{font-size:16px;font-weight:850;letter-spacing:-.3px;line-height:1.25}
  .dh-meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
  .stat{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 8px}
  .stat dt{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin:0 0 3px}
  .stat dd{margin:0;font-size:12.5px;font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat dd em{font-style:normal;font-size:9.5px;font-weight:650;color:var(--muted)}
  .sect{font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 2px 7px}
  .mission{font-size:13px;line-height:1.65;color:var(--ink2);margin:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:750;color:#0F766E;background:#CCFBF1;border-radius:7px;padding:5px 9px}
  .tips{margin:0;padding:0;list-style:none}
  .tips li{position:relative;padding:0 0 0 18px;margin-bottom:8px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .tips li:last-child{margin-bottom:0}
  .tips li:before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .dl{width:100%;border-collapse:collapse;font-size:12px}
  .dl th,.dl td{text-align:left;padding:8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
  .dl tr:last-child th,.dl tr:last-child td{border-bottom:0}
  .dl th{font-weight:700;color:var(--muted);width:40%}
  .dl td{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .dl td small{display:block;font-weight:600;color:var(--muted2);font-size:10px;margin-top:2px}
  .note{font-size:10.5px;line-height:1.5;color:var(--muted);margin:8px 2px 0}
  .hook{display:flex;gap:8px;padding:10px 11px;background:#F8FAFF;border:1px dashed #C7D2FE;border-radius:10px;font-size:11.5px;line-height:1.5;color:var(--ink2)}
  .hook b{color:var(--primary)}

  /* ---------- tab3 ---------- */
  .gauge-card{padding:14px 14px 14px;margin-bottom:12px;text-align:center;background:
    radial-gradient(320px 160px at 50% 0%, #EEF2FF 0%, rgba(238,242,255,0) 70%), #fff;
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .vci-title{font-size:9.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
  .gauge-wrap{position:relative;width:206px;height:206px;margin:2px auto 0}
  .gauge-wrap svg{width:206px;height:206px;display:block}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .vci-num{font-size:46px;font-weight:850;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,var(--primary) 0%,var(--indigo) 55%,var(--teal) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .vci-cap{font-size:8.5px;font-weight:850;letter-spacing:.16em;color:var(--muted2);margin-top:5px;text-transform:uppercase}
  .tier{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:5px 11px;border-radius:99px;background:#ECFDF5;color:#047857;font-size:11.5px;font-weight:850}
  .tier .dot2{width:6px;height:6px;border-radius:50%;background:#10B981;display:inline-block}
  .tier-note{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .pillar{margin-bottom:11px}
  .pillar:last-child{margin-bottom:0}
  .p-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;gap:6px}
  .p-name{font-size:11.5px;font-weight:750;color:var(--ink2)}
  .p-name em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted2);margin-left:4px}
  .p-val{font-size:11.5px;font-weight:850;color:var(--primary);font-variant-numeric:tabular-nums}
  .pillar input[type=range]::-webkit-slider-runnable-track{background:#EEF2F7}
  .pillar input[type=range]::-webkit-slider-thumb{width:17px;height:17px;margin-top:-5.5px;border-width:2px}
  .advice{display:flex;gap:9px;padding:11px 12px;border-radius:12px;background:#FFFBEB;border:1px solid #FDE68A;margin-top:12px}
  .advice .ico{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:#F59E0B;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}
  .advice p{margin:0;font-size:11.5px;line-height:1.45;color:#92400E}
  .advice p b{font-weight:850}
  details.road{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
  details.road[open]{border-color:#C7D2FE;box-shadow:var(--shadow-sm)}
  details.road summary{list-style:none;cursor:pointer;padding:11px 12px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;color:var(--ink)}
  details.road summary::-webkit-details-marker{display:none}
  .gy{width:26px;height:26px;border-radius:8px;background:#EEF2FF;color:var(--primary);display:grid;place-items:center;font-size:10.5px;font-weight:850;flex:0 0 auto}
  details.road summary .caret{margin-left:auto;color:var(--muted2);transition:transform .2s;font-size:11px}
  details.road[open] summary .caret{transform:rotate(90deg)}
  .r-body{padding:0 13px 12px 47px}
  .r-body ul{margin:0;padding:0;list-style:none}
  .r-body li{font-size:11.5px;line-height:1.5;color:var(--muted);margin-bottom:5px;position:relative}
  .r-body li:before{content:"";position:absolute;left:-11px;top:6px;width:4px;height:4px;border-radius:50%;background:#C7D2FE}
  .prog{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-decoration:none;color:inherit;margin-bottom:8px}
  .prog:hover{border-color:#C7D2FE;background:#FBFCFF}
  .prog .pico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:#EEF2FF}
  .prog .pico.b{background:#CCFBF1}
  .prog b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.1px}
  .prog small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
  .prog .arrow{margin-left:auto;color:var(--muted2);font-size:13px}
  .cta{display:block;text-align:center;text-decoration:none;margin-top:12px;padding:14px 12px;border-radius:13px;color:#fff;
    background:linear-gradient(120deg,var(--primary) 0%,#4338CA 55%,#0F766E 100%);
    box-shadow:0 8px 20px rgba(30,64,175,.26);font-weight:850;font-size:13.5px;letter-spacing:-.1px}
  .cta:hover{filter:brightness(1.04)}
  .cta small{display:block;font-size:10px;font-weight:650;opacity:.85;margin-top:4px;letter-spacing:0}
  .disc{font-size:9.5px;line-height:1.55;color:var(--muted2);margin:12px 2px 0}
  .disc b{color:var(--muted);font-weight:800}
  footer{padding:14px 4px 2px;border-top:1px solid var(--line2);margin-top:18px;display:flex;justify-content:space-between;gap:8px;font-size:9px;color:var(--muted2);line-height:1.5}
  footer b{color:var(--muted)}

  /* ---------- tab bar ---------- */
  .tabbar{
    flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:rgba(255,255,255,.97);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:saturate(180%) blur(8px)
  }
  .tb{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:0;background:none;
    font:inherit;font-size:9.5px;font-weight:750;color:var(--muted);cursor:pointer;border-radius:11px;letter-spacing:-.1px
  }
  .tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tb.on{color:var(--primary);background:#F4F6FE}
  .tb:focus-visible{outline:2px solid var(--primary-light);outline-offset:-2px}
</style>
</head>
<body>
<div class="page">
  <div class="shell" id="shell">

    <header class="app-head">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="8.4" stroke="#fff" stroke-width="1.3" stroke-opacity=".65"/>
          <path d="M15.6 8.4 13.3 13.3 8.4 15.6 10.7 10.7Z" fill="#fff" fill-opacity=".95"/>
          <circle cx="12" cy="12" r="1.15" fill="#1E40AF"/>
        </svg>
      </div>
      <div class="brand-txt">
        <strong>Vertex Compass</strong>
        <span id="brandTag">Vertex Education</span>

  function satBarHtml(s){
    if(!s.sat){ return '<span class="tf">'+esc(t("testFree"))+'</span>'; }
    var lo=s.sat[0], hi=s.sat[1], min=lo-160, max=hi+160;
    function p(x){ return clamp((x-min)/(max-min)*100,0,100); }
    var inBand = state.sat>=lo && state.sat<=hi;
    var status = inBand ? t("inBand") : (state.sat<lo ? t("belowBand") : t("aboveBand"));
    return ''+
      '<span class="sat">'+
        '<span class="sat-top"><span>'+esc(t("satBand"))+'</span><b>'+lo+'–'+hi+'</b></span>'+
        '<span class="bar"><span class="band" style="left:'+p(lo).toFixed(1)+'%;width:'+(p(hi)-p(lo)).toFixed(1)+'%"></span>'+
        '<span class="dot" style="left:'+p(state.sat).toFixed(1)+'%"></span></span>'+
        '<span class="sat-foot"><span>'+esc(t("yourPos"))+' <b>'+state.sat+'</b></span>'+
        '<span class="'+(inBand?'ok':'off')+'">'+esc(status)+'</span></span>'+
      '</span>';
  }

  function cardHtml(s){
    var fit=fitPct(s), c=cls(fit);
    var typeLabel = (s.type==="private"?"Private":"Public")+" · "+(s.kind==="LAC"?"Liberal Arts":"National");
    return ''+
      '<button type="button" class="school" data-act="school" data-id="'+s.id+'" aria-label="'+esc(s.name)+'">'+
        '<span class="s-top">'+
          '<span class="s-name">'+esc(s.name)+'<span class="s-loc">'+esc(s.loc)+' · '+typeLabel+'</span></span>'+
          '<span class="badge '+c+'">'+esc(badgeLabel(c))+'</span>'+
        '</span>'+
        '<span class="s-stats"><span>'+esc(t("pubRate"))+' <b>'+fmtPct(s.admit)+'</b></span>'+
          '<span>'+esc(t("rd"))+' <b>'+esc(s.rd)+'</b></span></span>'+
        satBarHtml(s)+
        '<span class="s-fit"><span>'+esc(t("fit"))+'</span><b>≈ '+Math.round(fit*100)+'%</b><i>'+esc(t("fitNote"))+'</i></span>'+
      '</button>';
  }

  function listHtml(){
    var arr=visibleSchools();
    if(!arr.length) return '<div class="empty">'+esc(t("empty"))+'</div>';
    var out='';
    for(var i=0;i<arr.length;i++) out+=cardHtml(arr[i]);
    return out;
  }

  function countHtml(){
    var n=visibleSchools().length;
    return n===15 ? t("countAll") : t("count").replace("{n}", String(n));
  }

  function majorOptions(){
    var labels=t("majors");
    return MAJORS.map(function(m){
      return '<option value="'+m.id+'"'+(state.major===m.id?' selected':'')+'>'+esc(labels[m.id])+'</option>';
    }).join("");
  }

  function chipsHtml(){
    var c=counts(), defs=[["all",t("all")],["reach",t("reach")],["target",t("target")],["safety",t("safety")]];
    return defs.map(function(d){
      var on = state.filter===d[0] ? " on" : "";
      return '<button type="button" class="chip'+on+'" data-act="filter" data-filter="'+d[0]+'">'+esc(d[1])+
        '<span class="n">'+c[d[0]]+'</span></button>';
    }).join("");
  }

  function tab1Html(){
    var satPos=Math.round((state.sat-800)/8);
    var gpaPos=Math.round((state.gpa-2.5)/1.5*100);
    return ''+
      '<div class="eyebrow">'+esc(t("t1Eye"))+'</div>'+
      '<h1>'+esc(t("t1Title"))+'</h1>'+
      '<p class="sub">'+esc(t("t1Sub"))+'</p>'+

      '<div class="card filter-card">'+
        '<div class="field">'+
          '<div class="field-head"><label for="satRange">'+esc(t("sat"))+'</label><span class="val" id="satVal">'+state.sat+'<small>/ 1600</small></span></div>'+
          '<input id="satRange" type="range" min="800" max="1600" step="10" value="'+state.sat+'" data-range="sat" aria-label="'+esc(t("sat"))+'">'+
          '<div class="range-scale"><span>800</span><span>1200</span><span>1600</span></div>'+
        '</div>'+
        '<div class="field">'+
          '<div class="field-head"><label for="gpaRange">'+esc(t("gpa"))+'</label><span class="val" id="gpaVal">'+state.gpa.toFixed(2)+'<small>'+esc(t("gpaUnit"))+'</small></span></div>'+
          '<input id="gpaRange" type="range" min="2.5" max="4" step="0.05" value="'+state.gpa+'" data-range="gpa" aria-label="'+esc(t("gpa"))+'">'+
          '<div class="range-scale"><span>2.50</span><span>3.25</span><span>4.00</span></div>'+
        '</div>'+
        '<div class="field">'+
          '<div class="field-head"><label for="majorSel">'+esc(t("major"))+'</label></div>'+
          '<select id="majorSel" data-select="major" aria-label="'+esc(t("major"))+'">'+majorOptions()+'</select>'+
        '</div>'+
      '</div>'+

      '<div class="chips" id="chips">'+chipsHtml()+'</div>'+
      '<div class="list-head"><span id="count">'+esc(countHtml())+'</span><span>'+esc(t("cdsNote"))+'</span></div>'+
      '<div id="schoolList">'+listHtml()+'</div>'+

      '<p class="disc">'+t("disclaimer")+'</p>'+
      footerHtml();
  }

  function tab2Html(){
    var s=school(state.school);
    var picker='<div class="field"><div class="field-head"><label for="schoolSel">'+esc(t("changeSchool"))+'</label></div>'+
      '<select id="schoolSel" data-select="school">'+
      SCHOOLS.map(function(x){ return '<option value="'+x.id+'"'+(x.id===state.school?' selected':'')+'>'+esc(x.name)+'</option>'; }).join("")+
      '</select></div>';

    if(!s){
      return '<div class="eyebrow">'+esc(t("t2Eye"))+'</div><h1>'+esc(t("t2Title"))+'</h1>'+
        '<div class="card pad" style="text-align:center"><p class="sub" style="margin:0 0 6px"><b>'+esc(t("pick"))+'</b></p>'+
        '<p class="sub" style="margin:0">'+esc(t("pickHint"))+'</p></div>'+
        '<div class="sect">'+esc(t("t2School"))+'</div>'+picker+footerHtml();
    }

    var fit=fitPct(s), c=cls(fit);
    var typeLabel=(s.type==="private"?"Private":"Public")+" · "+(s.kind==="LAC"?"Liberal Arts":"National");
    var initials=s.short || s.name.replace(/[^A-Z]/g,"").slice(0,2);
    var satTxt = s.sat ? (s.sat[0]+"–"+s.sat[1]) : t("testFree");
    var tips=L(s.tips)||[];
    var vals=s.values||[];

    return ''+
      '<button type="button" class="back" data-act="tab" data-tab="1">'+esc(t("back"))+'</button>'+
      '<div class="detail-head">'+
        '<div class="dh-top"><div class="crest" aria-hidden="true" style="font-size:'+(initials.length>2?'11.5px':'14px')+'">'+esc(initials)+'</div>'+
          '<div style="flex:1;min-width:0"><div class="dh-name">'+esc(s.name)+'</div>'+
          '<div class="dh-meta">'+esc(s.loc)+' · '+typeLabel+'</div></div>'+
          '<span class="badge '+c+'">'+esc(badgeLabel(c))+'</span></div>'+
        '<dl class="stats3">'+
          '<div class="stat"><dt>'+esc(t("pubRate"))+'</dt><dd>'+fmtPct(s.admit)+'</dd></div>'+
          '<div class="stat"><dt>SAT 25–75</dt><dd style="font-size:11.5px">'+esc(satTxt)+'</dd></div>'+
          '<div class="stat"><dt>'+esc(t("rd"))+'</dt><dd>'+esc(s.rd)+(s.rdNote?'<em> '+esc(s.rdNote)+'</em>':'')+'</dd></div>'+
        '</dl>'+
        '<div style="margin-top:10px">'+picker.replace('id="schoolSel"','id="schoolSel"')+'</div>'+
      '</div>'+

      '<div class="sect">'+esc(t("mission"))+'</div>'+
      '<div class="card pad"><p class="mission">'+esc(L(s.mission))+'</p>'+
        '<p class="note">'+esc(t("missionNote"))+'</p></div>'+

      '<div class="sect">'+esc(t("keywords"))+'</div>'+
      '<div class="tags">'+vals.map(function(v){ return '<span class="tag">'+esc(v)+'</span>'; }).join("")+'</div>'+

      '<div class="sect">'+esc(t("tips"))+'</div>'+
      '<div class="card pad"><ul class="tips">'+tips.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></div>'+

      '<div class="sect">'+esc(t("deadlines"))+'</div>'+
      '<div class="card pad"><table class="dl"><tbody>'+
        '<tr><th>'+esc(t("earlyRound"))+'</th><td>'+esc(s.early)+'</td></tr>'+
        '<tr><th>Regular Decision</th><td>'+esc(s.rd)+(s.rdNote?'<small>'+esc(s.rdNote)+'</small>':'')+'</td></tr>'+
        '<tr><th>'+esc(t("gpaBench"))+'</th><td>'+s.gpaBench.toFixed(2)+'<small>'+esc(t("gpaBenchNote"))+'</small></td></tr>'+
      '</tbody></table></div>'+
      '<p class="note">'+esc(t("dlNote"))+'</p>'+

      '<div class="sect">'+esc(t("hook"))+'</div>'+
      '<div class="hook"><b>'+esc(s.short||s.name)+'</b><span>'+esc(L(s.hook))+'</span></div>'+

      '<p class="disc">'+t("disclaimer")+'</p>'+
      footerHtml();
  }

  function vci(){
    var sum=0;
    for(var i=0;i<PILLARS.length;i++){ sum += state.pillars[PILLARS[i].id]*PILLARS[i].w; }
    return Math.round(sum/100);
  }
  function tierOf(v){
    if(v>=85) return 1; if(v>=72) return 2; if(v>=58) return 3; return 4;
  }
  var TIER_COLORS={1:"#047857",2:"#1D4ED8",3:"#B45309",4:"#64748B"};
  var TIER_BG={1:"#ECFDF5",2:"#EEF2FF",3:"#FFFBEB",4:"#F1F5F9"};

  function gaugeSvg(){
    var r=88, C=2*Math.PI*r, off=0, parts="";
    for(var i=0;i<PILLARS.length;i++){
      var p=PILLARS[i], v=state.pillars[p.id], len=C*p.w/100 - 6;
      if(len<2) len=2;
      var op=(0.30+0.70*(v/100)).toFixed(2);
      parts += '<circle cx="110" cy="110" r="'+r+'" fill="none" stroke="'+p.color+'" stroke-width="13" '+
        'stroke-linecap="round" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" '+
        'stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-opacity="'+op+'" transform="rotate(-90 110 110)"></circle>';
      off += C*p.w/100;
    }
    return '<svg viewBox="0 0 220 220" role="img" aria-label="Vertex Compass Index '+vci()+'/100">'+
      '<circle cx="110" cy="110" r="88" fill="none" stroke="#EEF2F7" stroke-width="13"></circle>'+
      parts+
      '<circle cx="110" cy="110" r="72" fill="none" stroke="#F1F5F9" stroke-width="1"></circle>'+
      '</svg>';
  }

  function gaugeBlockHtml(){
    var v=vci(), tier=tierOf(v), col=TIER_COLORS[tier], bg=TIER_BG[tier];
    return ''+
      '<div class="vci-title">Vertex Compass Index</div>'+
      '<div class="gauge-wrap">'+gaugeSvg()+
        '<div class="gauge-center"><div class="vci-num" id="vciNum">'+v+'</div>'+
        '<div class="vci-cap">'+esc(t("outOf"))+'</div></div>'+
      '</div>'+
      '<div class="tier" id="tierPill" style="background:'+bg+';color:'+col+'"><span class="dot2" style="background:'+col+'"></span>'+
        esc(t("tierPrefix"))+' '+tier+' · '+esc((t("tierBands")||[])[tier-1]||"")+'</div>'+
      '<p class="tier-note">'+esc(t("tierNote"))+'</p>';
  }

  function pillarsHtml(){
    var labels=t("pillarsLabel");
    return PILLARS.map(function(p){
      var lb=labels[p.id]||[p.id,""], v=state.pillars[p.id];
      return '<div class="pillar"><div class="p-head"><span class="p-name">'+esc(lb[0])+'<em>'+esc(lb[1])+' · '+p.w+'%</em></span>'+
        '<span class="p-val" id="pv-'+p.id+'">'+v+'</span></div>'+
        '<input type="range" min="0" max="100" step="1" value="'+v+'" data-range="pillar" data-id="'+p.id+'" aria-label="'+esc(lb[0])+'" style="accent-color:'+p.color+'">'+
        '</div>';
    }).join("");
  }

  function adviceHtml(){
    var low=null;
    PILLARS.forEach(function(p){ if(low===null || state.pillars[p.id]<state.pillars[low.id]) low=p; });
    var labels=t("pillarsLabel");
    if(state.pillars[low.id]>=85){ return '<div class="advice"><span class="ico">✓</span><p>'+t("adviceHigh")+'</p></div>'; }
    return '<div class="advice"><span class="ico">!</span><p>'+t("advice").replace("{name}", esc((labels[low.id]||[low.id])[0]))+'</p></div>';
  }

  function roadmapHtml(){
    var road=t("road");
    return road.map(function(r,i){
      var open = i===0 ? " open" : "";
      return '<details class="road"'+open+'><summary><span class="gy">G'+(9+i)+'</span><span>'+esc(r.t.replace(/^G\d+\s·\s/,""))+'</span><span class="caret">›</span></summary>'+
        '<div class="r-body"><ul>'+r.b.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join("")+'</ul></div></details>';
    }).join("");
  }

  function tab3Html(){
    return ''+
      '<div class="eyebrow">'+esc(t("t3Eye"))+'</div>'+
      '<h1>'+esc(t("t3Title"))+'</h1>'+
      '<p class="sub">'+esc(t("t3Sub"))+'</p>'+

      '<div class="gauge-card" id="gaugeCard">'+gaugeBlockHtml()+'</div>'+

      '<div class="card pad" style="margin-bottom:12px">'+
        '<h2 style="margin-bottom:11px">'+esc(t("pillars"))+'</h2>'+
        '<div id="pillarList">'+pillarsHtml()+'</div>'+
        '<div id="adviceWrap">'+adviceHtml()+'</div>'+
      '</div>'+

      '<div class="sect">'+esc(t("roadmap"))+'</div>'+
      roadmapHtml()+

      '<div class="sect">'+esc(t("programs"))+'</div>'+
      '<a class="prog" href="'+SITE_URL+'" target="_blank" rel="noopener">'+
        '<span class="pico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E40AF" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h7v13H4z"/><path d="M13 6h7v13h-7z"/><path d="M7.5 9.5h1M7.5 12.5h1M16.5 9.5h1"/></svg></span>'+
        '<span><b>'+esc(t("svhs"))+'</b><small>'+esc(t("svhsSub"))+'</small></span><span class="arrow">›</span></a>'+
      '<a class="prog" href="'+SITE_URL+'" target="_blank" rel="noopener">'+
        '<span class="pico b" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="m8.6 12.2 2.3 2.3 4.5-4.9"/></svg></span>'+
        '<span><b>'+esc(t("sdg"))+'</b><small>'+esc(t("sdgSub"))+'</small></span><span class="arrow">›</span></a>'+

      '<a class="cta" href="'+WAITLIST_URL+'" target="_blank" rel="noopener">'+esc(t("cta"))+'<small>'+esc(t("ctaSub"))+'</small></a>'+
      '<p class="disc">'+esc(t("disc"))+'</p>'+
      footerHtml();
  }

  function footerHtml(){
    return '<footer><span><b>Vertex Compass</b> v0.1</span><span>'+esc(t("footer"))+'<br>© 2026 Vertex Education</span></footer>';
  }

  /* ---------- render ---------- */
  var scrollMem={1:0,2:0,3:0};

  function render(){
    document.documentElement.lang = state.lang;
    document.getElementById("brandTag").textContent = t("tagline");
    var navMap={1:t("tab1"),2:t("tab2"),3:t("tab3")};
    document.querySelectorAll("[data-nav]").forEach(function(el){
      el.textContent = navMap[el.getAttribute("data-nav").replace("tab","")] || el.textContent;
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang")===state.lang);
    });
    ["tab1","tab2","tab3"].forEach(function(id,i){
      var el=document.getElementById(id);
      var n=i+1;
      if(n===1) el.innerHTML=tab1Html();
      if(n===2) el.innerHTML=tab2Html();
      if(n===3) el.innerHTML=tab3Html();
      el.classList.toggle("on", state.tab===n);
    });
    document.querySelectorAll(".tb").forEach(function(b){
      var on = Number(b.getAttribute("data-tab"))===state.tab;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on?"true":"false");
    });
    document.getElementById("scroll").scrollTop = scrollMem[state.tab] || 0;
    save();
  }

  function save(){
    try{ localStorage.setItem("vc_mvp_v01", JSON.stringify(state)); }catch(e){}
  }

  function updateList(){
    var el=document.getElementById("schoolList");
    if(el) el.innerHTML=listHtml();
    var c=document.getElementById("count");
    if(c) c.textContent=countHtml();
    var ch=document.getElementById("chips");
    if(ch) ch.innerHTML=chipsHtml();
  }

  function updateGauge(){
    var g=document.getElementById("gaugeCard");
    if(g) g.innerHTML=gaugeBlockHtml();
    PILLARS.forEach(function(p){
      var el=document.getElementById("pv-"+p.id);
      if(el) el.textContent=state.pillars[p.id];
    });
    var a=document.getElementById("adviceWrap");
    if(a) a.innerHTML=adviceHtml();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(e){
    var el=e.target.closest("[data-act]");
    if(!el) return;
    var act=el.getAttribute("data-act");
    if(act==="lang"){ state.lang=el.getAttribute("data-lang"); render(); }
    else if(act==="tab"){
      var n=Number(el.getAttribute("data-tab"));
      scrollMem[state.tab]=document.getElementById("scroll").scrollTop;
      state.tab=n; render();
      document.getElementById("scroll").scrollTop = scrollMem[n] || 0;
    }
    else if(act==="filter"){ state.filter=el.getAttribute("data-filter"); updateList(); }
    else if(act==="school"){
      state.school=el.getAttribute("data-id");
      scrollMem[state.tab]=0; state.tab=2; render();
      document.getElementById("scroll").scrollTop=0;
    }
  });

  document.addEventListener("input", function(e){
    var el=e.target;
    if(el.getAttribute && el.getAttribute("data-range")==="sat"){
      state.sat=Number(el.value);
      var v=document.getElementById("satVal");
      if(v) v.innerHTML=state.sat+'<small>/ 1600</small>';
      updateList();
      var g=document.getElementById("gaugeCard");
      if(g) g.innerHTML=gaugeBlockHtml();
    }
    else if(el.getAttribute && el.getAttribute("data-range")==="gpa"){
      state.gpa=Number(el.value);
      var v2=document.getElementById("gpaVal");
      if(v2) v2.innerHTML=state.gpa.toFixed(2)+'<small>'+esc(t("gpaUnit"))+'</small>';
      updateList();
    }
    else if(el.getAttribute && el.getAttribute("data-range")==="pillar"){
      state.pillars[el.getAttribute("data-id")]=Number(el.value);
      updateGauge();
    }
  });

  document.addEventListener("change", function(e){
    var el=e.target;
    if(el.getAttribute && el.getAttribute("data-select")==="major"){ state.major=el.value; updateList(); }
    if(el.getAttribute && el.getAttribute("data-select")==="school"){ state.school=el.value; render(); }
  });

  /* ---------- boot ---------- */
  try{
    var saved=JSON.parse(localStorage.getItem("vc_mvp_v01")||"null");
    if(saved && saved.pillars && ["ko","en","vi"].indexOf(saved.lang)>-1){
      state = Object.assign(state, saved);
      state.tab = 1;
    }
  }catch(e){}
  render();
  window.__VC = { state:state, SCHOOLS:SCHOOLS, fitPct:fitPct, vci:vci, render:render };
})();
</script>
</body>
</html>

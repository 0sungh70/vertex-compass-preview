<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<title>Vertex Compass — MVP v0.2.1 (review build)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231E40AF'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-opacity='.6'/%3E%3Cpath d='M20 12l-3 6-6 2 3-6z' fill='white'/%3E%3C/svg%3E">
<meta name="description" content="Vertex Compass v0.2.1 review build — 51 US universities and colleges with academic-band comparison, source links, partner routes, historical earnings reference (10 years after entry) and a 4-year roadmap (internal review, links disabled).">
<style>
  :root{
    --primary:#1E40AF; --primary-dark:#1B3699; --primary-light:#3B82F6;
    --indigo:#4F46E5; --teal:#0D9488; --amber:#F59E0B; --rose:#E11D48;
    --ink:#0F172A; --ink2:#334155; --muted:#64748B; --muted2:#94A3B8;
    --line:#E2E8F0; --line2:#EEF2F7; --bg:#F4F6FB; --card:#FFFFFF;
    --soft:#F8FAFC; --radius:16px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.05);
    --shadow-md:0 8px 24px rgba(15,23,42,.08), 0 2px 6px rgba(15,23,42,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(900px 520px at 85% -10%, #E0E7FF 0%, rgba(224,231,255,0) 60%),
      radial-gradient(700px 460px at 0% 0%, #CCFBF1 0%, rgba(204,251,241,0) 55%),
      linear-gradient(180deg,#F7F9FD 0%, #EEF2F8 100%);
    color:var(--ink);
    font-family:"Liberation Sans","Noto Sans CJK KR",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  .page{min-height:100%;display:flex;align-items:center;justify-content:center}
  .shell{
    width:100%;max-width:420px;height:100vh;height:100dvh;background:#fff;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  @media (min-width:640px){
    .page{padding:26px}
    .shell{height:min(880px, calc(100dvh - 52px));border-radius:30px;
      box-shadow:0 30px 70px rgba(15,23,42,.18), 0 4px 12px rgba(15,23,42,.06), 0 0 0 1px rgba(15,23,42,.05);}
  }
  @media (prefers-reduced-motion:no-preference){
    .shell{animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }

  /* ---------- header ---------- */
  .app-head{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px 11px;border-bottom:1px solid var(--line2);
    background:linear-gradient(180deg,#FFFFFF 0%,#FCFDFF 100%);z-index:5;
  }
  .mark{width:32px;height:32px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(140deg,var(--primary) 0%,var(--indigo) 58%,var(--teal) 100%);
    display:grid;place-items:center;box-shadow:0 3px 8px rgba(30,64,175,.28)}
  .mark svg{width:20px;height:20px;display:block}
  .brand-txt{display:flex;flex-direction:column;line-height:1.16;min-width:0}
  .brand-txt strong{font-size:15.5px;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
  .brand-txt span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:650}
  .ver{font-size:8.5px;font-weight:800;letter-spacing:.02em;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:5px;padding:1px 4px;text-transform:none}
  .lang{margin-left:auto;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
  .lang button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:750;
    padding:4px 7px;border-radius:7px;cursor:pointer;letter-spacing:.02em;
  }
  .lang button.on{background:#fff;color:var(--primary);box-shadow:var(--shadow-sm)}
  .lang button:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}

  /* ---------- main ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:15px 14px 24px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .tab{display:none}
  .tab.on{display:block}
  .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:2px 0 7px}
  h1{font-size:20.5px;line-height:1.3;letter-spacing:-.4px;margin:0 0 6px}
  h2{font-size:14.5px;letter-spacing:-.2px;margin:0 0 4px}
  .sub{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0 0 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .pad{padding:13px}

  /* ---------- review banner ---------- */
  .review-bar{
    display:block;padding:8px 10px;margin:0 0 12px;border-radius:10px;
    background:#FFFBEB;border:1px solid #FDE68A;font-size:10.5px;line-height:1.45;color:#92400E;font-weight:650;
  }
  .review-bar b{font-weight:850;margin-right:4px}

  /* ---------- inputs ---------- */
  .filter-card{padding:13px;margin-bottom:12px;background:linear-gradient(180deg,#FFFFFF,#FBFDFF)}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px;gap:8px}
  .field-head label{font-size:11.5px;font-weight:750;color:var(--ink2);letter-spacing:.01em}
  .field-head .val{font-size:14px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
  .field-head .val small{font-size:10.5px;color:var(--muted);font-weight:650;margin-left:3px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;display:block;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,#DBEAFE,#E0E7FF)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50%;background:#fff;
    border:2.5px solid var(--primary);box-shadow:0 2px 6px rgba(30,64,175,.28)
  }
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:#E0E7FF}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2.5px solid var(--primary);box-shadow:0 2px 6px rgba(30,64,175,.28)}
  input[type=range]:focus-visible{outline:2px solid var(--primary-light);outline-offset:4px;border-radius:99px}
  .range-scale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:1px;font-variant-numeric:tabular-nums}
  select{
    width:100%;font:inherit;font-size:12.5px;font-weight:650;color:var(--ink2);
    padding:9px 30px 9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5 11 1.5' fill='none' stroke='%2364748B' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  select:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}
  .field-note{font-size:9.5px;line-height:1.4;color:var(--muted2);margin:6px 0 0}

  .chips{display:flex;gap:5px;margin:0 0 10px;flex-wrap:wrap}
  .chip{
    font:inherit;font-size:11px;font-weight:700;color:var(--muted);background:#fff;
    border:1px solid var(--line);border-radius:99px;padding:5px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:5px
  }
  .chip .n{font-size:10px;font-weight:800;color:var(--muted2);background:var(--soft);border-radius:99px;padding:0 5px;line-height:15px}
  .chip.on{background:#EEF2FF;border-color:#C7D2FE;color:var(--primary)}
  .chip.on .n{background:#fff;color:var(--primary)}
  .chip:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}
  .list-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 8px;gap:8px}
  .list-head span{font-size:11px;font-weight:700;color:var(--muted)}
  .list-head small{font-size:9.5px;color:var(--muted2);text-align:right}

  /* ---------- school cards ---------- */
  .school{
    width:100%;text-align:left;font:inherit;color:inherit;background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:11px 12px 10px;margin-bottom:8px;
    box-shadow:var(--shadow-sm);cursor:pointer;display:block;transition:border-color .15s, box-shadow .15s, transform .15s;
  }
  .school:hover{border-color:#C7D2FE;box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .school:focus-visible{outline:2px solid var(--primary-light);outline-offset:1px}
  .s-top{display:flex;align-items:flex-start;gap:8px}
  .s-name{font-size:14px;font-weight:800;letter-spacing:-.2px;line-height:1.25;flex:1;min-width:0}
  .s-loc{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:3px;line-height:1.35}
  .bandpill{font-size:9px;font-weight:850;letter-spacing:.03em;padding:3px 6px;border-radius:6px;white-space:nowrap;margin-top:1px;border:1px solid transparent}
  .bandpill.above{background:#DCFCE7;color:#15803D;border-color:#BBF7D0}
  .bandpill.within{background:#DBEAFE;color:#1D4ED8;border-color:#BFDBFE}
  .bandpill.below{background:#FEF3C7;color:#B45309;border-color:#FDE68A}
  .bandpill.testfree{background:#F1F5F9;color:#475569;border-color:#E2E8F0}
  .bandpill.sections{background:#EDE9FE;color:#6D28D9;border-color:#DDD6FE}
  .s-stats{display:flex;gap:11px;margin:8px 0 2px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
  .s-stats b{color:var(--ink2);font-weight:800;font-variant-numeric:tabular-nums}
  .pill{font-size:8.5px;font-weight:850;letter-spacing:.02em;border-radius:5px;padding:1px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .pill.closed{background:#F1F5F9;color:#64748B}
  .pill.soon{background:#FEE2E2;color:#B91C1C}
  .pill.open{background:#ECFDF5;color:#047857}
  .sat{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)}
  .sat-top{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);gap:8px}
  .sat-top b{color:var(--ink2);font-variant-numeric:tabular-nums}
  .bar{display:block;position:relative;height:7px;border-radius:99px;background:#EEF2F7;margin:6px 0 5px}
  .bar .band{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#BFDBFE,#C7D2FE);border-radius:99px}
  .bar .dot{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--primary);transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(30,64,175,.35)}
  .sat-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);gap:8px;flex-wrap:wrap}
  .sat-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
  .sat-foot .ok{color:#15803D;font-weight:750}
  .sat-foot .off{color:#B45309;font-weight:750}
  .sat-split{display:block;margin-top:8px;padding:7px 9px;background:var(--soft);border-radius:8px;font-size:10px;color:var(--muted);font-weight:650;line-height:1.5}
  .sat-split b{color:var(--ink2);font-variant-numeric:tabular-nums}
  .tf{display:block;margin-top:8px;padding:7px 9px;background:var(--soft);border-radius:8px;font-size:10.5px;color:var(--muted);font-weight:650}
  .s-earn{display:flex;align-items:baseline;gap:6px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line2)}
  .s-earn span{font-size:10px;font-weight:700;color:var(--muted)}
  .s-earn b{font-size:12.5px;font-weight:850;color:#0F766E;font-variant-numeric:tabular-nums;margin-left:auto}
  .s-earn i{font-size:8.5px;color:var(--muted2);font-style:normal}
  .empty{padding:24px 16px;text-align:center;font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--soft)}

  /* ---------- tab2 ---------- */
  .back{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;color:var(--primary);background:none;border:0;padding:2px 0;margin-bottom:9px;cursor:pointer;font-family:inherit}
  .detail-head{padding:13px;margin-bottom:10px;background:linear-gradient(160deg,#F8FAFF 0%,#FFFFFF 60%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .dh-top{display:flex;gap:10px;align-items:flex-start}
  .crest{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;font-weight:850;color:#fff;letter-spacing:-.5px;background:linear-gradient(140deg,var(--primary),var(--indigo) 60%,var(--teal));box-shadow:0 3px 8px rgba(30,64,175,.22)}
  .dh-name{font-size:16px;font-weight:850;letter-spacing:-.3px;line-height:1.25}
  .dh-meta{font-size:10.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
  .stat{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:7px 8px;min-width:0}
  .stat dt{font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);margin:0 0 3px}
  .stat dd{margin:0;font-size:12px;font-weight:850;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
  .stat dd em{font-style:normal;font-size:9px;font-weight:650;color:var(--muted);display:block;margin-top:2px}
  .sect{font-size:10.5px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:15px 2px 6px;display:flex;align-items:center;gap:6px}
  .sect .tag-mini{font-size:8.5px;letter-spacing:0;text-transform:none;font-weight:750;color:#0F766E;background:#CCFBF1;border-radius:5px;padding:1px 5px}
  .sect .tag-mini.warn{color:#92400E;background:#FEF3C7}
  .mission{font-size:13px;line-height:1.65;color:var(--ink2);margin:0}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;font-weight:750;color:#0F766E;background:#CCFBF1;border-radius:7px;padding:5px 9px}
  .tips{margin:0;padding:0;list-style:none}
  .tips li{position:relative;padding:0 0 0 18px;margin-bottom:8px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
  .tips li:last-child{margin-bottom:0}
  .tips li:before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--teal)}
  .dl{width:100%;border-collapse:collapse;font-size:12px}
  .dl th,.dl td{text-align:left;padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:top}
  .dl tr:last-child th,.dl tr:last-child td{border-bottom:0}
  .dl th{font-weight:700;color:var(--muted);width:38%}
  .dl td{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
  .dl td small{display:block;font-weight:600;color:var(--muted2);font-size:10px;margin-top:2px}
  .dl td .pill{margin-left:5px}
  .note{font-size:10.5px;line-height:1.5;color:var(--muted);margin:7px 2px 0}
  .note b{color:var(--ink2)}
  .hook{display:flex;gap:8px;padding:10px 11px;background:#F8FAFF;border:1px dashed #C7D2FE;border-radius:10px;font-size:11.5px;line-height:1.5;color:var(--ink2)}
  .hook b{color:var(--primary)}
  .cmp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cmp-line{font-size:11.5px;color:var(--ink2);line-height:1.5}
  .cmp-line b{font-variant-numeric:tabular-nums}
  .srcs{width:100%;border-collapse:collapse;font-size:10px}
  .srcs th,.srcs td{text-align:left;padding:5px 0;border-bottom:1px dotted var(--line2);vertical-align:top;line-height:1.45}
  .srcs tr:last-child th,.srcs tr:last-child td{border-bottom:0}
  .srcs th{font-weight:750;color:var(--muted);width:31%;padding-right:7px}
  .srcs td{color:var(--ink2);font-weight:650}
  .srcs a.srcl{color:var(--primary);font-weight:800;text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(30,64,175,.35)}
  .srcs a.srcl:hover{border-bottom-color:var(--primary)}
  .src-note{font-size:9.5px;color:var(--muted2);margin:6px 0 0;line-height:1.45}

  /* ---------- earnings ---------- */
  .earn-card{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(170deg,#F0FDFA 0%,#FFFFFF 55%);box-shadow:var(--shadow-sm)}
  .earn-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .earn-big strong{font-size:26px;font-weight:850;letter-spacing:-1px;color:#0F766E;font-variant-numeric:tabular-nums;line-height:1.1}
  .earn-big small{font-size:10px;color:var(--muted);line-height:1.45;font-weight:650}
  .earn-sub{font-size:10.5px;color:var(--muted);margin:5px 0 0;line-height:1.5}
  .career{border-top:1px solid var(--line2);margin-top:9px;padding-top:8px}
  .career-row{display:flex;align-items:baseline;gap:8px;font-size:11.5px;line-height:1.45;padding:3px 0}
  .career-row .cmaj{color:var(--muted);font-weight:700;flex:0 0 auto;max-width:45%}
  .career-row .cjob{color:var(--ink2);font-weight:750;flex:1;min-width:0}
  .career-row .cpay{color:var(--ink);font-weight:850;font-variant-numeric:tabular-nums}
  .earn-meta{margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line2);display:grid;gap:5px}
  .earn-meta div{display:block}
  .earn-meta dt{font-size:9px;font-weight:850;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);line-height:1.5;margin:0 0 1px}
  .earn-meta dd{margin:0;font-size:9.5px;color:var(--ink2);font-weight:650;line-height:1.5;overflow-wrap:anywhere}
  .earn-meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;background:#F1F5F9;padding:1px 4px;border-radius:4px}

  /* ---------- tab3 ---------- */
  .gauge-card{padding:13px 13px 13px;margin-bottom:11px;text-align:center;background:
    radial-gradient(320px 160px at 50% 0%, #EEF2FF 0%, rgba(238,242,255,0) 70%), #fff;
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .vci-title{font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
  .gauge-wrap{position:relative;width:200px;height:200px;margin:2px auto 0}
  .gauge-wrap svg{width:200px;height:200px;display:block}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .vci-num{font-size:44px;font-weight:850;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,var(--primary) 0%,var(--indigo) 55%,var(--teal) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .vci-cap{font-size:8px;font-weight:850;letter-spacing:.14em;color:var(--muted2);margin-top:5px;text-transform:uppercase}
  .tier{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:99px;background:#ECFDF5;color:#047857;font-size:11px;font-weight:850}
  .tier .dot2{width:6px;height:6px;border-radius:50%;background:#10B981;display:inline-block}
  .tier-note{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45;text-align:left}
  .pillar{margin-bottom:10px}
  .pillar:last-child{margin-bottom:0}
  .p-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;gap:6px}
  .p-name{font-size:11.5px;font-weight:750;color:var(--ink2)}
  .p-name em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--muted2);margin-left:4px}
  .p-val{font-size:11.5px;font-weight:850;color:var(--primary);font-variant-numeric:tabular-nums}
  .pillar input[type=range]::-webkit-slider-runnable-track{background:#EEF2F7}
  .pillar input[type=range]::-webkit-slider-thumb{width:17px;height:17px;margin-top:-5.5px;border-width:2px}

  /* v0.2.1 — one classification order, used by the card pill, the chip counts and the detail card:
       1) testFree                    -> "testfree"
       2) composite sat [lo,hi]       -> "above" / "within" / "below"   (a published composite always wins)
       3) satSplit only (sat absent)   -> "sections"   (Harvard / Caltech / UMass Boston)
       4) neither                      -> "unverified"
     satSplit must never override a published composite range (Yale, Princeton, Brown …). */
  function bandKey(s){
    if(s.testFree) return "testfree";
    if(Array.isArray(s.sat)){
      if(state.sat>=s.sat[1]) return "above";
      if(state.sat>=s.sat[0]) return "within";
      return "below";
    }
    if(s.satSplit) return "sections";
    return "unverified";
  }

  function vci(){
    var sum=0;
    for(var i=0;i<PILLARS.length;i++){ sum += state.pillars[PILLARS[i].id]*PILLARS[i].w; }
    return Math.round(sum/100);
  }
  function tierOf(v){
    if(v>=85) return 1; if(v>=72) return 2; if(v>=58) return 3; return 4;
  }
  var TIER_COLORS={1:"#047857",2:"#1D4ED8",3:"#B45309",4:"#64748B"};
  var TIER_BG={1:"#ECFDF5",2:"#EEF2FF",3:"#FFFBEB",4:"#F1F5F9"};

  function gaugeSvg(){
    var r=88, C=2*Math.PI*r, off=0, parts="";
    for(var i=0;i<PILLARS.length;i++){
      var p=PILLARS[i], v=state.pillars[p.id], len=C*p.w/100 - 6;
      if(len<2) len=2;
      var op=(0.30+0.70*(v/100)).toFixed(2);
      parts += '<circle cx="110" cy="110" r="'+r+'" fill="none" stroke="'+p.color+'" stroke-width="13" '+
        'stroke-linecap="round" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" '+
        'stroke-dashoffset="'+(-off).toFixed(2)+'" stroke-opacity="'+op+'" transform="rotate(-90 110 110)"></circle>';
      off += C*p.w/100;
    }
    return '<svg viewBox="0 0 220 220" role="img" aria-label="Vertex Compass Index '+vci()+'/100">'+
      '<circle cx="110" cy="110" r="88" fill="none" stroke="#EEF2F7" stroke-width="13"></circle>'+
      parts+
      '<circle cx="110" cy="110" r="72" fill="none" stroke="#F1F5F9" stroke-width="1"></circle>'+
      '</svg>';
  }

        '<div class="gauge-center"><div class="vci-num" id="vciNum">'+v+'</div>'+

    return PILLARS.map(function(p){
      var lb=labels[p.id]||[p.id,""], v=state.pillars[p.id];
      return '<div class="pillar"><div class="p-head"><span class="p-name">'+esc(lb[0])+'<em>'+esc(lb[1])+' · '+p.w+'%</em></span>'+
        '<span class="p-val" id="pv-'+p.id+'">'+v+'</span></div>'+
        '<input type="range" min="0" max="100" step="1" value="'+v+'" data-range="pillar" data-id="'+p.id+'" aria-label="'+esc(lb[0])+'" style="accent-color:'+p.color+'">'+
        '</div>';
    }).join("");
  }

  function adviceHtml(){
    var low=null;
    PILLARS.forEach(function(p){ if(low===null || state.pillars[p.id]<state.pillars[low.id]) low=p; });
    var labels=t("pillarsLabel");
    if(state.pillars[low.id]>=85){ return '<div class="advice"><span class="ico">✓</span><p>'+t("adviceHigh")+'</p></div>'; }
    return '<div class="advice"><span class="ico">!</span><p>'+t("advice").replace("{name}", esc((labels[low.id]||[low.id])[0]))+'</p></div>';
  }

  function roadTitle(s){ var i=s.indexOf("·"); return i>-1 ? s.slice(i+1).trim() : s; }

  function roadmapHtml(){
    var road=t("road");
    return road.map(function(r,i){
      var open = i===0 ? " open" : "";
      return '<details class="road"'+open+'><summary><span class="gy">G'+(9+i)+'</span><span>'+esc(roadTitle(r.t))+'</span><span class="caret">›</span></summary>'+ 
        '<div class="r-body"><ul>'+r.b.map(function(b){ return '<li>'+esc(b)+'</li>'; }).join("")+'</ul></div></details>';
    }).join("");
  }

  function tab3Html(){
    return ''+
      '<div class="eyebrow">'+esc(t("t3Eye"))+'</div>'+
      '<h1>'+esc(t("t3Title"))+'</h1>'+
      '<p class="sub">'+esc(t("t3Sub"))+'</p>'+

      '<div class="gauge-card" id="gaugeCard">'+gaugeBlockHtml()+'</div>'+

      '<div class="card pad" style="margin-bottom:11px">'+
        '<h2 style="margin-bottom:10px">'+esc(t("pillars"))+'</h2>'+
        '<div id="pillarList">'+pillarsHtml()+'</div>'+
        '<div id="adviceWrap">'+adviceHtml()+'</div>'+
      '</div>'+

      '<div class="sect">'+esc(t("roadmap"))+'</div>'+
      roadmapHtml()+

      '<div class="sect">'+esc(t("programs"))+'<span class="tag-mini warn">'+esc(t("reviewChip"))+'</span></div>'+
      '<div class="prog disabled" role="note" aria-disabled="true">'+
        '<span class="pico" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h7v13H4z"/><path d="M13 6h7v13h-7z"/><path d="M7.5 9.5h1M7.5 12.5h1M16.5 9.5h1"/></svg></span>'+
        '<span><b>'+esc(t("svhs"))+'</b><small>'+esc(t("progDisabled"))+'</small></span><span class="arrow">🔒</span></div>'+
      '<div class="prog disabled" role="note" aria-disabled="true">'+
        '<span class="pico b" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="m8.6 12.2 2.3 2.3 4.5-4.9"/></svg></span>'+
        '<span><b>'+esc(t("sdg"))+'</b><small>'+esc(t("progDisabled"))+'</small></span><span class="arrow">🔒</span></div>'+

      '<div class="cta disabled" role="note" aria-disabled="true">'+esc(t("ctaDisabled"))+'<small>'+esc(t("ctaSub"))+'</small>'+
        '<span class="en-label">Review Build · Waitlist / Programme links disabled pending final approval</span></div>'+
      '<p class="disc">'+t("disc")+'</p>'+
      (flash?'<p class="flash">'+esc(flash)+'</p>':'')+
      '<div class="storage"><p>'+esc(t("storageNote"))+'</p><button type="button" class="reset" data-act="reset">'+esc(t("reset"))+'</button></div>'+
      footerHtml();
  }

  function footerHtml(){
    return '<footer><span><b>Vertex Compass</b> v0.2.1 · '+esc(t("reviewChip"))+'</span><span>'+esc(t("footer"))+'<br>© 2026 Vertex Education</span></footer>';
  }

  /* ---------- render ---------- */
  var scrollMem={1:0,2:0,3:0};

  function render(){
    document.documentElement.lang = state.lang;
    document.getElementById("brandTag").textContent = t("tagline");
    var navMap={1:t("tab1"),2:t("tab2"),3:t("tab3")};
    document.querySelectorAll("[data-nav]").forEach(function(el){
      el.textContent = navMap[el.getAttribute("data-nav").replace("tab","")] || el.textContent;
    });
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang")===state.lang);
    });
    ["tab1","tab2","tab3"].forEach(function(id,i){
      var el=document.getElementById(id);
      var n=i+1;
      if(n===1) el.innerHTML=tab1Html();
      if(n===2) el.innerHTML=tab2Html();
      if(n===3) el.innerHTML=tab3Html();
      el.classList.toggle("on", state.tab===n);
    });
    document.querySelectorAll(".tb").forEach(function(b){
      var on = Number(b.getAttribute("data-tab"))===state.tab;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on?"true":"false");
    });
    document.getElementById("scroll").scrollTop = scrollMem[state.tab] || 0;
    flash="";
    save();
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function restore(){
    state = JSON.parse(JSON.stringify(DEFAULTS));
    var raw=null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
    if(!raw) return;
    var s=null;
    try{ s=JSON.parse(raw); }catch(e){ return; }
    if(!s || typeof s!=="object") return;
    if(["ko","en","vi"].indexOf(s.lang)>-1) state.lang=s.lang;
    if(typeof s.sat==="number" && isFinite(s.sat)) state.sat=clamp(Math.round(s.sat/10)*10,800,1600);
    if(typeof s.gpa==="number" && isFinite(s.gpa)) state.gpa=clamp(s.gpa,2.5,4);
    if(typeof s.major==="string" && (s.major==="all" || MAJORS.indexOf(s.major)>-1)) state.major=s.major;
    if(FILTERS.indexOf(s.filter)>-1) state.filter=s.filter;
    if(s.partner==="all"||s.partner==="shorelight") state.partner=s.partner;
    if(s.acc==="all"||s.acc==="acc45") state.acc=s.acc;
    if(typeof s.school==="string" && school(s.school)) state.school=s.school;
    if(s.pillars && typeof s.pillars==="object"){
      PILLARS.forEach(function(p){
        if(typeof s.pillars[p.id]==="number" && isFinite(s.pillars[p.id])) state.pillars[p.id]=clamp(Math.round(s.pillars[p.id]),0,100);
      });
    }
    if(s.tab===1||s.tab===2||s.tab===3) state.tab=s.tab;
  }

  function updateList(){
    var el=document.getElementById("schoolList");
    if(el) el.innerHTML=listHtml();
    var c=document.getElementById("count");
    if(c) c.textContent=countHtml();
    var ch=document.getElementById("chips");
    if(ch) ch.innerHTML=chipsHtml();
    var ch2=document.getElementById("chips2");
    if(ch2) ch2.innerHTML=chips2Html();
  }

  function updateGauge(){
    var g=document.getElementById("gaugeCard");
    if(g) g.innerHTML=gaugeBlockHtml();
    PILLARS.forEach(function(p){
      var el=document.getElementById("pv-"+p.id);
      if(el) el.textContent=state.pillars[p.id];
    });
    var a=document.getElementById("adviceWrap");
    if(a) a.innerHTML=adviceHtml();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function(e){
    var el=e.target.closest("[data-act]");
    if(!el) return;
    var act=el.getAttribute("data-act");
    if(act==="lang"){ state.lang=el.getAttribute("data-lang"); render(); }
    else if(act==="tab"){
      var n=Number(el.getAttribute("data-tab"));
      scrollMem[state.tab]=document.getElementById("scroll").scrollTop;
      state.tab=n; render();
      document.getElementById("scroll").scrollTop = scrollMem[n] || 0;
    }
    else if(act==="filter"){ state.filter=el.getAttribute("data-filter"); updateList(); save(); }
    else if(act==="pfilter"){ state.partner=el.getAttribute("data-pf"); updateList(); save(); }
    else if(act==="afilter"){ state.acc=el.getAttribute("data-af"); updateList(); save(); }
    else if(act==="school"){
      state.school=el.getAttribute("data-id");
      scrollMem[state.tab]=0; state.tab=2; render();
      document.getElementById("scroll").scrollTop=0;
    }
    else if(act==="reset"){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
      var d = JSON.parse(JSON.stringify(DEFAULTS));
      Object.keys(state).forEach(function(k){ delete state[k]; });
      Object.keys(d).forEach(function(k){ state[k]=d[k]; });
      flash = t("resetDone");
      render();
    }
  });

  document.addEventListener("input", function(e){
    var el=e.target;
    var kind = el.getAttribute && el.getAttribute("data-range");
    if(kind==="sat"){
      state.sat=Number(el.value);
      var v=document.getElementById("satVal");
      if(v) v.innerHTML=state.sat+'<small>/ 1600</small>';
      updateList(); save();
    }
    else if(kind==="gpa"){
      state.gpa=Number(el.value);
      var v2=document.getElementById("gpaVal");
      if(v2) v2.innerHTML=state.gpa.toFixed(2)+'<small>'+esc(t("gpaUnit"))+'</small>';
      updateList(); save();
    }
    else if(kind==="pillar"){
      state.pillars[el.getAttribute("data-id")]=Number(el.value);
      updateGauge(); save();
    }
  });

  document.addEventListener("change", function(e){
    var el=e.target;
    var sel = el.getAttribute && el.getAttribute("data-select");
    if(sel==="major"){ state.major=el.value; updateList(); save(); }
    if(sel==="school"){ state.school=el.value; render(); }
  });

  /* ---------- boot ---------- */
  restore();
  render();
  window.__VC = {
    version:"0.2.1", state:state, SCHOOLS:SCHOOLS, MAJORS:MAJORS, CAREERS:CAREERS,
    bandKey:bandKey, vci:vci, x:x, EXT:EXT, rdLabel:rdLabel, render:render, storageKey:STORAGE_KEY, save:save, restore:restore
  };
})();
</script>
</body>
</html>
